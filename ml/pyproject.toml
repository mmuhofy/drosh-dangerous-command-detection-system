[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drosh-ml"
version = "0.1.0"
description = "Dangerous-command detection model for Drosh — dataset generation, training and export"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
authors = [{ name = "Muhofy", email = "muhofy@drosh.dev" }]

# Keep the runtime dependency set deliberately tiny. scikit-learn is used only
# for the vectoriser and the ordinal logistic regression; the exported model
# itself is a plain float array with no third-party dependency at all.
dependencies = [
  "scikit-learn>=1.5,<2",
  "numpy>=1.26",
  "joblib>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
drosh-ml = "drosh_ml.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["../ml/tests"]
pythonpath = ["src"]